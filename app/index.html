<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>망각곡선 복습</title>
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="복습">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <button id="back" class="icon" aria-label="뒤로" hidden>‹</button>
  <h1 id="title">복습</h1>
  <div id="actions"></div>
</header>
<main id="view" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody"></div>
    <div class="row">
      <button value="cancel" class="ghost" id="dlgCancel" formnovalidate>취소</button>
      <button value="ok" class="primary" id="dlgOk">확인</button>
    </div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
