<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사다리타기</title>
<style>
  :root {
    --bg: #0a0b1a; --text: #f1f2ff; --muted: #8e93b8;
    --glass: rgba(255,255,255,.06); --glass-b: rgba(255,255,255,.14);
    --rail: rgba(190,200,255,.22);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); overflow-x: hidden;
    font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: 28px 16px 40px; background: var(--bg); position: relative;
  }
  /* 배경: 흐르는 네온 블롭 + 격자 */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(90px); opacity: .5;
    animation: drift 18s ease-in-out infinite alternate; }
  .bg i:nth-child(1) { background: #6d28d9; left: -14vmax; top: -16vmax; }
  .bg i:nth-child(2) { background: #0ea5e9; right: -18vmax; top: 18vh; animation-delay: -6s; opacity: .38; }
  .bg i:nth-child(3) { background: #ec4899; left: 10vw; bottom: -26vmax; animation-delay: -11s; opacity: .34; }
  .bg::after { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 38px 38px; mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%); }
  @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.18); } }

  main { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { margin: 0; font-size: clamp(34px, 9vw, 54px); font-weight: 900; letter-spacing: -.03em; line-height: 1.1;
    background: linear-gradient(100deg, #67e8f9, #a78bfa 45%, #f472b6 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(167,139,250,.45)); }
  .sub { color: var(--muted); margin: 8px 0 0; }

  .card { background: var(--glass); border: 1px solid var(--glass-b); border-radius: 24px; padding: 18px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12); }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
  .stepper { display: flex; align-items: center; gap: 4px; margin-right: auto; background: rgba(255,255,255,.06);
    border: 1px solid var(--glass-b); border-radius: 999px; padding: 3px; }
  .stepper output { min-width: 3.4em; text-align: center; font-weight: 800; }
  button { font: inherit; color: var(--text); cursor: pointer; border: 1px solid var(--glass-b); background: rgba(255,255,255,.07);
    border-radius: 999px; padding: 8px 15px; transition: transform .12s, background .2s, box-shadow .2s; }
  button:hover:not(:disabled) { background: rgba(255,255,255,.14); }
  button:active:not(:disabled) { transform: scale(.94); }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid #67e8f9; outline-offset: 2px; }
  .stepper button { width: 34px; height: 34px; padding: 0; border: 0; font-size: 18px; }
  button.primary { border: 0; font-weight: 800; color: #0a0b1a;
    background: linear-gradient(100deg, #67e8f9, #a78bfa 60%, #f472b6); box-shadow: 0 0 24px rgba(167,139,250,.55); }
  button.primary:hover:not(:disabled) { background: linear-gradient(100deg, #8df0ff, #b9a0ff 60%, #ff8fc9); }
  #mute { width: 38px; height: 38px; padding: 0; font-size: 17px; }

  .row { display: grid; gap: 8px; }
  .cell { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .cell input { width: 100%; min-width: 0; font: inherit; font-weight: 700; text-align: center; padding: 9px 2px; color: var(--text);
    background: rgba(255,255,255,.07); border: 1px solid var(--glass-b); border-radius: 12px; }
  .go { --c: #fff; width: 46px; height: 46px; padding: 0; border-radius: 50%; font-size: 15px; color: #0a0b1a; border: 0;
    background: radial-gradient(circle at 35% 30%, #fff8, transparent 45%), var(--c);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent), 0 0 22px color-mix(in srgb, var(--c) 75%, transparent);
    animation: pulse 2.2s ease-in-out infinite; }
  .go:hover:not(:disabled) { background: radial-gradient(circle at 35% 30%, #fffa, transparent 50%), var(--c); transform: scale(1.1); }
  .go:disabled { animation: none; opacity: .3; box-shadow: none; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--c) 10%, transparent), 0 0 32px color-mix(in srgb, var(--c) 90%, transparent); } }

  .shape { text-align: center; margin-top: 14px; font-size: 13px; font-weight: 800; letter-spacing: .12em; color: #c4b5fd; text-shadow: 0 0 12px rgba(167,139,250,.8); }
  canvas { display: block; width: 100%; height: 640px; margin: 10px 0; }

  .result input { --hit: transparent; text-align: center; transition: box-shadow .3s, background .3s, transform .3s; }
  .result input.hit { transform: translateY(-3px) scale(1.06); font-weight: 900; color: #fff;
    background: color-mix(in srgb, var(--hit) 40%, #0a0b1a); border-color: var(--hit);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--hit) 35%, transparent), 0 0 30px var(--hit); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.7); } }
  .hint { color: var(--muted); font-size: 13px; margin: 16px 0 0; text-align: center; }
  .org { display: inline-block; margin: 0 0 14px; padding: 8px 26px; border-radius: 999px; font-size: clamp(20px, 5.5vw, 30px); font-weight: 900; letter-spacing: .08em; color: #fff;
    background: linear-gradient(100deg, rgba(103,232,249,.25), rgba(167,139,250,.3), rgba(244,114,182,.25)); border: 1.5px solid rgba(255,255,255,.35);
    box-shadow: 0 0 28px rgba(167,139,250,.6), inset 0 0 18px rgba(255,255,255,.08); text-shadow: 0 0 14px rgba(103,232,249,.9), 0 0 30px rgba(167,139,250,.8); }
  @media (prefers-reduced-motion: reduce) { .bg i, .go { animation: none; } }
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<main>
  <header>
    <div class="org">광산 장년회</div>
    <h1>사다리타기</h1>
    <p class="sub">이름 아래 불빛을 눌러 출발! 결과는 미리 공개되어 있어요.</p>
  </header>
  <div class="card">
    <div class="controls">
      <div class="stepper">
        <button id="minus" aria-label="인원 줄이기">−</button>
        <output id="n">4명</output>
        <button id="plus" aria-label="인원 늘리기">+</button>
      </div>
      <button id="mute" aria-label="소리 켜기/끄기" title="소리 켜기/끄기">🔊</button>
      <button id="all" class="primary">전체 출발</button>
      <button id="shuffle">다시 섞기</button>
    </div>
    <div class="row" id="top"></div>
    <div class="shape" id="shape"></div>
    <canvas id="cv"></canvas>
    <div class="row result" id="bottom"></div>
    <p class="hint">이름과 결과는 직접 고칠 수 있어요. 고친 뒤 "다시 섞기"를 누르면 새 사다리가 만들어집니다.</p>
  </div>
</main>
<script>
(function () {
  var MIN = 2, MAX = 6, ROWS = 28, SPEED = 1.1; // SPEED: px/ms
  var COLORS = ['#fb7185', '#60a5fa', '#4ade80', '#fbbf24', '#c084fc', '#22d3ee'];
  var DEF_RESULTS = ['당첨', '꽝', '꽝', '꽝', '꽝', '꽝'];

  var n = 4, names = [], results = [];
  var bridges = [];          // bridges[r][i]: i열과 i+1열 사이의 가로줄 여부
  var done = {};             // 시작 열 -> true
  var anim = {};             // 시작 열 -> {p, t0, k}
  var parts = [];            // 파티클
  var raf = 0, lastT = 0;

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var shapeEl = document.getElementById('shape'), topEl = document.getElementById('top'), bottomEl = document.getElementById('bottom');

  /* ---------- 소리 (WebAudio 합성, 외부 파일 없음) ---------- */
  var muted = false, ac = null;
  try { muted = localStorage.getItem('ladder-muted') === '1'; } catch (e) {}
  function audio() {
    if (muted) return null;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { return null; }
    return ac;
  }
  function beep(f, dur, type, vol, delay, slideTo) {
    var a = audio(); if (!a) return;
    var t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  var NOTES = [523.25, 587.33, 659.25, 783.99, 880, 987.77];
  var sfx = {
    start: function (i) { beep(220 + i * 30, 0.35, 'sawtooth', 0.04, 0, 880 + i * 60); },
    tick: function (k) { beep(420 + (k % 6) * 70, 0.07, 'square', 0.035); },
    arrive: function (i) {
      var f = NOTES[i % NOTES.length];
      beep(f, 0.22, 'triangle', 0.12, 0); beep(f * 1.25, 0.22, 'triangle', 0.12, 0.09); beep(f * 1.5, 0.4, 'triangle', 0.13, 0.18);
    },
    win: function () {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, k) { beep(f, 0.3, 'square', 0.06, k * 0.09); beep(f, 0.5, 'triangle', 0.1, k * 0.09); });
    },
    click: function () { beep(660, 0.05, 'sine', 0.06, 0, 440); }
  };
  var muteBtn = document.getElementById('mute');
  function paintMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  paintMute();
  muteBtn.addEventListener('click', function () {
    muted = !muted; paintMute();
    try { localStorage.setItem('ladder-muted', muted ? '1' : '0'); } catch (e) {}
    sfx.click();
  });

  /* ---------- 사다리 로직 ---------- */
  // bridges[r][i]: 0 없음, 1 가로줄, 2 사선(X자 교차: r행 -> r+1행으로 대각선 이동)
  function makeBridges() {
    var b = [], occ = [], r, i;
    for (r = 0; r < ROWS; r++) { b.push([]); occ.push([]); for (i = 0; i < n - 1; i++) { b[r].push(0); occ[r].push(false); } }
    function free(r, i) { return r >= 0 && r < ROWS && i >= 0 && i < n - 1 && !occ[r][i]; }
    function block(r, i) { if (r >= 0 && r < ROWS && i >= 0 && i < n - 1) occ[r][i] = true; }
    function putH(r, i) { b[r][i] = 1; block(r, i - 1); block(r, i); block(r, i + 1); }
    function canX(r, i) { return r + 1 < ROWS && [i - 1, i, i + 1].every(function (k) { return k < 0 || k > n - 2 || (free(r, k) && free(r + 1, k)); }); }
    function putX(r, i) { b[r][i] = 2; for (var k = i - 1; k <= i + 1; k++) { block(r, k); block(r + 1, k); } }
    for (r = 0; r < ROWS; r++) {
      var order = [];
      for (i = 0; i < n - 1; i++) order.push(i);
      order.sort(function () { return Math.random() - .5; });
      order.forEach(function (i) {
        if (!free(r, i)) return;
        var roll = Math.random();
        if (roll < 0.2 && canX(r, i)) putX(r, i);
        else if (roll < 0.2 + 0.55 && !(i > 0 && occ[r][i - 1]) && !(i < n - 2 && occ[r][i + 1])) putH(r, i);
      });
    }
    for (i = 0; i < n - 1; i++) { // 모든 칸 사이에 가로줄과 사선이 최소 하나씩
      [1, 2].forEach(function (t) {
        var has = false, cands = [];
        for (r = 0; r < ROWS; r++) if (b[r][i] === t) has = true;
        if (has) return;
        for (r = 0; r < ROWS; r++) if (t === 1 ? (!occ[r][i] && !(i > 0 && occ[r][i - 1]) && !(i < n - 2 && occ[r][i + 1])) : canX(r, i)) cands.push(r);
        if (cands.length) { var rr = cands[Math.floor(Math.random() * cands.length)]; if (t === 1) putH(rr, i); else putX(rr, i); }
      });
    }
    return b;
  }
  function stepCol(c, r) { return bridges[r][c] ? c + 1 : (c > 0 && bridges[r][c - 1] ? c - 1 : c); }
  function trace(start) { var c = start; for (var r = 0; r < ROWS; r++) c = stepCol(c, r); return { end: c }; }

  /* ---------- 화면 구성 ---------- */
  function readInputs() {
    names = [].map.call(topEl.querySelectorAll('input'), function (e) { return e.value; });
    results = [].map.call(bottomEl.querySelectorAll('input'), function (e) { return e.value; });
  }
  function buildCells() {
    topEl.style.gridTemplateColumns = bottomEl.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    topEl.innerHTML = bottomEl.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var t = document.createElement('div'); t.className = 'cell';
      var ti = document.createElement('input');
      ti.value = names[i] != null ? names[i] : (i + 1) + '번'; ti.setAttribute('aria-label', (i + 1) + '번째 참가자 이름');
      var go = document.createElement('button'); go.className = 'go'; go.textContent = '▶';
      go.style.setProperty('--c', COLORS[i]); go.dataset.i = i; go.setAttribute('aria-label', (i + 1) + '번째 참가자 출발');
      go.addEventListener('click', function () { run(+this.dataset.i); });
      t.appendChild(ti); t.appendChild(go); topEl.appendChild(t);
      var b = document.createElement('div'); b.className = 'cell';
      var bi = document.createElement('input');
      bi.value = results[i] != null ? results[i] : DEF_RESULTS[i]; bi.setAttribute('aria-label', (i + 1) + '번째 결과');
      b.appendChild(bi); bottomEl.appendChild(b);
    }
    document.getElementById('n').textContent = n + '명';
    document.getElementById('minus').disabled = n <= MIN;
    document.getElementById('plus').disabled = n >= MAX;
  }
  function reset() {
    done = {}; anim = {}; parts = [];
    [].forEach.call(bottomEl.querySelectorAll('input'), function (e) { e.classList.remove('hit'); });
    [].forEach.call(topEl.querySelectorAll('.go'), function (e) { e.disabled = false; });
    draw();
  }
  function rollLook() {
    var prev = shape; while (SHAPES.length > 1 && shape === prev) shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    bends = bridges.map(function (row) { return row.map(function (t) { return t === 1 && Math.random() < 0.4 ? (Math.random() < .5 ? -1 : 1) * (7 + Math.random() * 9) : 0; }); });
    shapeEl.textContent = '오늘의 모양 · ' + shape.name;
  }
  function newLadder() { readInputs(); bridges = makeBridges(); rollLook(); buildCells(); reset(); }

  /* ---------- 그리기 ---------- */
  // 모양: w(t)=세로 위치 t(0~1)에서의 폭(0.3~1), s(t)=가로 이동. 양 끝은 결과칸에 맞춰 원래 간격으로 이어짐
  var SHAPES = [
    { name: '하트', s: function () { return 0; }, w: function (t) {
      return t < 0.28 ? 0.5 + 0.5 * Math.sin(t / 0.28 * Math.PI / 2) : 1 - 0.74 * Math.pow((t - 0.28) / 0.72, 1.15); } },
    { name: '다이아몬드', s: function () { return 0; }, w: function (t) { return 0.3 + 0.7 * Math.pow(1 - Math.abs(2 * t - 1), 0.9); } },
    { name: '모래시계', s: function () { return 0; }, w: function (t) { return 1 - 0.68 * Math.pow(Math.sin(Math.PI * t), 2); } },
    { name: '풍선', s: function () { return 0; }, w: function (t) { return 0.32 + 0.68 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.08)), 0.6); } },
    { name: '물결', s: function (t) { return 0.1 * Math.sin(4 * Math.PI * t); }, w: function () { return 0.78; } },
    { name: '별빛', s: function () { return 0; }, w: function (t) { return 0.5 + 0.5 * Math.abs(Math.sin(2.5 * Math.PI * t)); } }
  ];
  var shape = SHAPES[Math.floor(Math.random() * SHAPES.length)], bends = [];
  function smooth(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  function xAt(c, y, g) {
    var t = y / g.h, e = smooth(Math.min(t, 1 - t) / 0.12), w = 1 + (shape.w(t) - 1) * e, sh = shape.s(t) * e;
    return g.w * (0.5 + sh + (c - (n - 1) / 2) / n * w);
  }
  function geom() {
    var w = cv.clientWidth, h = cv.clientHeight;
    return { w: w, h: h, y: function (r) { return (r + 0.5) * h / ROWS; } };
  }
  function railPts(c, y0, y1, g, out) {
    var steps = Math.max(1, Math.ceil((y1 - y0) / 8));
    for (var k = 1; k <= steps; k++) { var y = y0 + (y1 - y0) * k / steps; out.push([xAt(c, y, g), y]); }
  }
  // c열에서 nc열로 건너가는 가로줄(곡선 포함, kind 1) 또는 사선(S자 곡선, kind 2)의 점들
  function rungPts(c, nc, r, kind, g, out) {
    var y0 = g.y(r), k, u;
    if (kind === 2) {
      var y1 = g.y(r + 1), ax = xAt(c, y0, g), bx = xAt(nc, y1, g), m = (y1 - y0) * 0.6;
      for (k = 1; k <= 16; k++) {
        u = k / 16; var v = 1 - u;
        out.push([v * v * v * ax + 3 * v * v * u * ax + 3 * v * u * u * bx + u * u * u * bx,
                  v * v * v * y0 + 3 * v * v * u * (y0 + m) + 3 * v * u * u * (y1 - m) + u * u * u * y1]);
      }
    } else {
      var x0 = xAt(c, y0, g), x1 = xAt(nc, y0, g), bd = bends[r] ? bends[r][Math.min(c, nc)] : 0;
      if (!bd) { out.push([x1, y0]); return; }
      for (k = 1; k <= 12; k++) {
        u = k / 12; var w = 1 - u;
        out.push([w * w * x0 + 2 * w * u * (x0 + x1) / 2 + u * u * x1, w * w * y0 + 2 * w * u * (y0 + 2 * bd) + u * u * y0]);
      }
    }
  }
  function points(start) {
    var g = geom(), pts = [[xAt(start, 0, g), 0]], mi = [], c = start, cy = 0, r, cum = [0];
    for (r = 0; r < ROWS; r++) {
      var y = g.y(r);
      railPts(c, cy, y, g, pts); cy = y;
      var nc = stepCol(c, r);
      if (nc !== c) {
        var kind = bridges[r][Math.min(c, nc)];
        mi.push(pts.length - 1); rungPts(c, nc, r, kind, g, pts); c = nc;
        if (kind === 2) cy = g.y(r + 1);
      }
    }
    railPts(c, cy, g.h, g, pts);
    for (var k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
    return { pts: pts, cum: cum, total: cum[cum.length - 1], end: c, mk: mi.map(function (i) { return cum[i]; }) };
  }
  function headAt(p, len) {
    for (var k = 1; k < p.pts.length; k++) if (p.cum[k] >= len) {
      var f = (len - p.cum[k - 1]) / (p.cum[k] - p.cum[k - 1] || 1);
      return [p.pts[k - 1][0] + (p.pts[k][0] - p.pts[k - 1][0]) * f, p.pts[k - 1][1] + (p.pts[k][1] - p.pts[k - 1][1]) * f];
    }
    return p.pts[p.pts.length - 1];
  }
  function strokePath(p, len, color, width) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = ctx.lineCap = 'round';
    ctx.shadowColor = color; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(p.pts[0][0], p.pts[0][1]);
    for (var k = 1; k < p.pts.length && p.cum[k - 1] < len; k++) {
      if (p.cum[k] <= len) ctx.lineTo(p.pts[k][0], p.pts[k][1]);
      else { var h = headAt(p, len); ctx.lineTo(h[0], h[1]); }
    }
    ctx.stroke(); ctx.restore();
  }
  function draw() {
    var dpr = window.devicePixelRatio || 1, g = geom(), c, r, i;
    if (cv.width !== Math.round(g.w * dpr) || cv.height !== Math.round(g.h * dpr)) {
      cv.width = Math.round(g.w * dpr); cv.height = Math.round(g.h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, g.w, g.h);
    var rail = [], pl;
    for (c = 0; c < n; c++) { var rp = [[xAt(c, 0, g), 0]]; railPts(c, 0, g.h, g, rp); rail.push(rp); }
    // 모양 실루엣 (바깥 두 줄 사이를 은은하게 채움)
    ctx.beginPath();
    rail[0].forEach(function (q, k) { k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    rail[n - 1].slice().reverse().forEach(function (q) { ctx.lineTo(q[0], q[1]); });
    ctx.closePath();
    var gr = ctx.createLinearGradient(0, 0, 0, g.h); gr.addColorStop(0, 'rgba(103,232,249,.10)'); gr.addColorStop(.5, 'rgba(167,139,250,.14)'); gr.addColorStop(1, 'rgba(244,114,182,.10)');
    ctx.fillStyle = gr; ctx.fill();
    ctx.strokeStyle = 'rgba(190,200,255,.26)'; ctx.lineWidth = 3; ctx.lineCap = ctx.lineJoin = 'round';
    for (c = 0; c < n; c++) { ctx.beginPath(); rail[c].forEach(function (q, k) { k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke(); }
    for (r = 0; r < ROWS; r++) for (i = 0; i < n - 1; i++) if (bridges[r][i]) {
      var dirs = bridges[r][i] === 2 ? [[i, i + 1], [i + 1, i]] : [[i, i + 1]];
      dirs.forEach(function (d) {
        pl = [[xAt(d[0], g.y(r), g), g.y(r)]]; rungPts(d[0], d[1], r, bridges[r][i], g, pl);
        ctx.beginPath(); pl.forEach(function (q, k) { k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke();
      });
    }
    Object.keys(done).forEach(function (s) { var p = points(+s); strokePath(p, p.total, COLORS[s], 5); });
    var now = performance.now();
    Object.keys(anim).forEach(function (s) {
      var a = anim[s], len = Math.min(a.p.total, (now - a.t0) * SPEED), h = headAt(a.p, len);
      strokePath(a.p, len, COLORS[s], 6);
      ctx.save(); ctx.fillStyle = '#fff'; ctx.shadowColor = COLORS[s]; ctx.shadowBlur = 28;
      ctx.beginPath(); ctx.arc(h[0], h[1], 8, 0, 7); ctx.fill(); ctx.restore();
    });
    parts.forEach(function (q) {
      ctx.save(); ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.color; ctx.shadowColor = q.color; ctx.shadowBlur = 10;
      ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s * (q.rect ? .5 : 1)); ctx.restore();
    });
  }
  function burst(x, y, color, count, power) {
    for (var k = 0; k < count; k++) {
      var ang = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.3, v = (0.15 + Math.random()) * power;
      parts.push({ x: x, y: y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, life: 1, s: 4 + Math.random() * 5, rect: Math.random() < .5,
        color: Math.random() < .6 ? color : ['#fff', '#fde047', '#f472b6', '#67e8f9'][k % 4] });
    }
  }

  /* ---------- 애니메이션 ---------- */
  function tick(t) {
    var dt = Math.min(48, t - (lastT || t)); lastT = t;
    var now = performance.now(), active = false;
    Object.keys(anim).forEach(function (s) {
      var a = anim[s], len = Math.min(a.p.total, (now - a.t0) * SPEED), h = headAt(a.p, len);
      while (a.k < a.p.mk.length && a.p.mk[a.k] <= len) sfx.tick(a.k++); // 가로줄·사선을 건널 때 틱
      parts.push({ x: h[0] + (Math.random() - .5) * 4, y: h[1] + (Math.random() - .5) * 4, vx: (Math.random() - .5) * .05, vy: (Math.random() - .5) * .05,
        life: .7, s: 2 + Math.random() * 3, color: COLORS[s] });
      if (len >= a.p.total) {
        done[s] = true; delete anim[s];
        var inp = bottomEl.querySelectorAll('input')[a.p.end], win = inp.value.trim() === '당첨';
        inp.style.setProperty('--hit', COLORS[s]); inp.classList.add('hit');
        burst(a.p.pts[a.p.pts.length - 1][0], cv.clientHeight - 4, COLORS[s], win ? 90 : 36, win ? .7 : .45);
        if (win) { sfx.win(); burst(cv.clientWidth / 2, cv.clientHeight, COLORS[s], 60, .9); } else sfx.arrive(+s);
      } else active = true;
    });
    parts.forEach(function (q) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 0.0014 * dt; q.life -= dt / (q.rect !== undefined ? 900 : 380); });
    parts = parts.filter(function (q) { return q.life > 0; });
    draw();
    raf = (active || parts.length) ? requestAnimationFrame(tick) : 0;
    if (!raf) lastT = 0;
  }
  function run(i) {
    if (done[i] || anim[i]) return;
    topEl.querySelectorAll('.go')[i].disabled = true;
    anim[i] = { p: points(i), t0: performance.now(), k: 0 };
    sfx.start(i);
    if (!raf) raf = requestAnimationFrame(tick);
  }

  document.getElementById('all').addEventListener('click', function () { for (var i = 0; i < n; i++) run(i); });
  document.getElementById('shuffle').addEventListener('click', function () { sfx.click(); newLadder(); });
  document.getElementById('minus').addEventListener('click', function () { if (n > MIN) { sfx.click(); readInputs(); n--; names.length = results.length = n; newLadder(); } });
  document.getElementById('plus').addEventListener('click', function () { if (n < MAX) { sfx.click(); readInputs(); n++; newLadder(); } });
  window.addEventListener('resize', draw);

  window.ladder = { trace: trace, points: points, get n() { return n; }, get bridges() { return bridges; } };
  bridges = makeBridges(); rollLook(); buildCells(); draw();
})();
</script>
</body>
